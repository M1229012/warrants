name: Active ETF Daily Report

on:
  workflow_dispatch:
  schedule:
    # 台北時間 20:10 = UTC 12:10，週一至週五
    - cron: "10 12 * * 1-5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install report dependencies
        run: pip install -r requirements.txt

      - name: Generate reports
        run: python active_etf_daily_report.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: active-etf-report
          path: |
            output/*.png
            output/*.csv
          retention-days: 30

      # 保存 DB，讓下一次 workflow 有完整歷史可比較。
      # 注意：若你不想把 DB commit 到 repo，可改用 GitHub Cache / Release。
      - name: Commit latest DB and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_holdings.db output/*.png output/*.csv || true
          git diff --cached --quiet || git commit -m "chore: update active ETF daily report"
          git push
