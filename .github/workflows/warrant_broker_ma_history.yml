name: FinMind warrant broker MA history

on:
  workflow_dispatch:
    inputs:
      force_recalculate_stats:
        description: "只用本機快取重算事件與統計，不重新下載權證日檔"
        required: false
        default: false
        type: boolean
      force_redownload_dates:
        description: "強制重抓日期，逗號分隔，例如 2023-06-21,2023-06-26"
        required: false
        default: ""
        type: string
      continuation_depth:
        description: "自動續跑代數；由 workflow 維護，手動執行請保持 0"
        required: false
        default: "0"
        type: string
  schedule:
    # 台北時間每週二至週六 09:30 執行，處理前一交易日已發布資料。
    - cron: "30 1 * * 2-6"

permissions:
  contents: read
  actions: write

concurrency:
  group: warrant-broker-ma-history
  cancel-in-progress: false

jobs:
  build-ma-history:
    name: Download, resume, and calculate
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Taipei
      FINMIND_API_0714: ${{ secrets.FINMIND_API_0714 }}
      MA_HISTORY_BASE_DIR: ${{ github.workspace }}
      MA_HISTORY_CACHE_DIR: ${{ github.workspace }}/warrant_cache/ma_history
      OUTPUT_DIR: ${{ github.workspace }}/output
      # compact_daily 只保存可重新配對的交易事實，驗證成功後不保留全市場 raw。
      KEEP_RAW_DAILY: "0"
      # 抽樣或全量身分未配對率超過此值即停止，禁止產生近乎空白的報表。
      MAX_IDENTITY_UNMATCHED_PCT: "5"
      # 身分索引明確採週更，避免與每日排程的 24 小時邊界互相抖動。
      IDENTITY_INDEX_CACHE_HOURS: "168"
      # Summary API 必須明確帶歷史起日；按年度分段下載並另存獨立快取。
      WARRANT_SUMMARY_HISTORY_START_DATE: "2011-01-03"
      FORCE_RECALCULATE_STATS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_recalculate_stats && '1' || '0' }}
      FORCE_REDOWNLOAD_DATES: ${{ github.event_name == 'workflow_dispatch' && inputs.force_redownload_dates || '' }}
      CONTINUATION_DEPTH: ${{ github.event_name == 'workflow_dispatch' && inputs.continuation_depth || '0' }}
      MAX_AUTO_CONTINUATIONS: "6"
      RUN_CUTOFF_MINUTES: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas openpyxl pyarrow

      # 使用每次執行唯一的新 key，restore-keys 會取最近一次成功保存的歷史快取。
      # restore/save 分開，確保主程式失敗或優雅停止後仍會嘗試保存逐日 checkpoint。
      - name: Restore historical cache
        id: restore-history
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MA_HISTORY_CACHE_DIR }}
          key: warrant-ma-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            warrant-ma-history-${{ runner.os }}-

      - name: Verify program
        run: |
          python -m py_compile warrant_broker_ma_history.py
          python warrant_broker_ma_history.py --self-test

      - name: Run historical workflow with graceful cutoff
        id: run-history
        shell: bash
        run: |
          set +e

          needs_continue=false

          # GitHub-hosted runner 單一 job 最長六小時；五小時先送出 SIGINT，
          # 保存 cache 後由後續 step 自動 workflow_dispatch 下一輪。
          timeout --signal=INT --kill-after=2m "${RUN_CUTOFF_MINUTES}m" \
            python warrant_broker_ma_history.py
          status=$?

          if [[ "$status" -eq 124 || "$status" -eq 130 ]]; then
            stage="$(
              python -c "import json, os, pathlib; p=pathlib.Path(os.environ['MA_HISTORY_CACHE_DIR']) / 'state.json'; print(json.loads(p.read_text(encoding='utf-8')).get('current_stage', 'unknown') if p.exists() else 'unknown')" \
                2>/dev/null || echo unknown
            )"
            echo "程式收到超時中止訊號；當時階段=$stage"

            if [[ "$stage" == "downloading" ]]; then
              echo "下載階段已安全中止；保存 cache 後將自動啟動下一輪。"
              needs_continue=true
              status=0
            elif [[ "$stage" == "complete" ]]; then
              echo "程式已完成，不需要續跑。"
              status=0
            elif [[ "$stage" == "statistics" ]]; then
              echo "統計階段未完成，本次沒有完整報表；下載快取已保存，但 job 必須標記失敗。"
            else
              echo "初始化尚未完成，本次不得標記成功。"
            fi
          fi

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "needs_continue=$needs_continue" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save historical cache
        id: save-history
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MA_HISTORY_CACHE_DIR }}
          key: warrant-ma-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Excel and result Parquet
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: warrant-broker-ma-history-${{ github.run_number }}
          path: |
            ${{ env.OUTPUT_DIR }}/warrant_broker_ma_history_*.xlsx
            ${{ env.MA_HISTORY_CACHE_DIR }}/results/*.parquet
            ${{ env.MA_HISTORY_CACHE_DIR }}/state.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Dispatch next continuation run
        if: >-
          always() &&
          steps.run-history.outputs.needs_continue == 'true' &&
          steps.save-history.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_depth="${CONTINUATION_DEPTH:-0}"
          if ! [[ "$current_depth" =~ ^[0-9]+$ ]]; then
            echo "continuation_depth 不是非負整數：$current_depth"
            exit 1
          fi
          if (( current_depth >= MAX_AUTO_CONTINUATIONS )); then
            echo "已達自動續跑上限 ${MAX_AUTO_CONTINUATIONS} 輪；停止建立新 workflow。"
            exit 1
          fi

          next_depth=$((current_depth + 1))
          workflow_id="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.workflow_id'
          )"
          payload="$(
            jq -n \
              --arg ref "$GITHUB_REF_NAME" \
              --arg depth "$next_depth" \
              '{
                ref: $ref,
                inputs: {
                  force_recalculate_stats: "false",
                  force_redownload_dates: "",
                  continuation_depth: $depth
                }
              }'
          )"
          printf '%s' "$payload" | gh api \
            --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            --input -
          echo "已建立第 ${next_depth} 輪續跑；新 workflow 會還原剛保存的最新 cache。"

      - name: Fail if continuation cache was not saved
        if: >-
          always() &&
          steps.run-history.outputs.needs_continue == 'true' &&
          steps.save-history.outcome != 'success'
        shell: bash
        run: |
          echo "歷史 cache 保存失敗，因此未啟動下一輪，避免從舊進度繼續。"
          exit 1

      - name: Propagate program failure
        if: always() && steps.run-history.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "warrant_broker_ma_history.py 執行失敗，exit code=${{ steps.run-history.outputs.exit_code }}"
          exit "${{ steps.run-history.outputs.exit_code }}"
