name: Warrant Backtest Google Sheet - FinMind + MoneyDJ Hybrid

on:
  workflow_dispatch:
    inputs:
      run_plan:
        description: "執行方案"
        required: true
        default: "每日自動流程"
        type: choice
        options:
          - "每日自動流程"
          - "精選五分點新分類"
          - "長期留單補價格"
          - "完整修補模式"

  # 測試期間停用排程，只保留 workflow_dispatch。
  # 驗證 MoneyDJ 資料正確後，再與 FinMind 工作流程錯開至少 30 分鐘啟用。


permissions:
  contents: read
  actions: write


jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # ============================================================
      # 路徑與程式
      # ============================================================
      OUTPUT_DIR: output
      CACHE_DIR: warrant_cache
      # 請把修正版程式內容放進這個既有檔名；若改用其他檔名，這裡也要同步修改。
      PYTHON_FILE: warrant_backtest_moneydj.py
      FINMIND_API_0714: ${{ secrets.FINMIND_API_0714 }}

      # ============================================================
      # FinMind 全市場完整歷史（Hybrid repair 主要歷史來源）
      # 完整修補模式：FinMind 補足最近 200 個成功交易日；
      # MoneyDJ 負責近期候選與最新交易日補強。
      # ============================================================
      FINMIND_API_BASE: "https://api.finmindtrade.com/api/v4"
      FINMIND_CACHE_SCHEMA_VERSION: "finmind-v2-date-aware"
      FINMIND_METADATA_CACHE_HOURS: "18"
      FINMIND_HISTORY_WORKERS: "10"
      FINMIND_MAX_RETRIES: "4"
      FINMIND_RETRY_BASE_SECONDS: "2"
      FINMIND_REQUEST_TIMEOUT_CONNECT: "8"
      FINMIND_REQUEST_TIMEOUT_READ: "120"

      FINMIND_FORCE_REFRESH_TARGET_DATE: "1"
      FINMIND_INITIAL_BACKFILL_ON_EMPTY: "1"
      FINMIND_REPAIR_ALLOW_TARGET_FALLBACK: "1"
      FINMIND_REPAIR_TARGET_FALLBACK_TRADING_DAYS: "15"

      # 舊 MoneyDJ 候選歷史不能被當成 FinMind 全市場完整歷史。
      # 第一次執行 Hybrid 完整修補時會建立來源標記並補足 200 個成功交易日。
      FINMIND_REPAIR_HISTORY_SOURCE_ID: "finmind-full-market-200d-hybrid-v1"
      FINMIND_REPAIR_STRICT_HISTORY_WINDOW: "1"
      FINMIND_REPAIR_SUCCESS_DAY_BACKFILL_ENABLED: "1"
      FINMIND_REPAIR_SUCCESS_DAY_EXTRA_LIMIT: "30"
      FINMIND_REPAIR_SUCCESS_DAY_BATCH_SIZE: "6"
      FINMIND_RAW_DAILY_RETENTION_DAYS: "7"
      CACHE_WRITE_CSV_COMPAT: "0"

      # ============================================================
      # MoneyDJ 資料來源
      # API4：近期權證分點候選與最新市場日期
      # API5：權證＋分點歷史買賣資料
      # ============================================================
      MONEYDJ_HISTORY_WORKERS: "50"
      MONEYDJ_PRESCAN_WORKERS: "60"
      MONEYDJ_FIND_BROKER_WORKERS: "40"
      MONEYDJ_RECENT_SCAN_DAYS: "50"
      MONEYDJ_API5_HISTORY_LIMIT: "200"
      MONEYDJ_MAX_RETRIES: "3"
      MONEYDJ_RETRY_BASE_SECONDS: "1.0"
      MONEYDJ_ISIN_TIMEOUT_SECONDS: "30"
      MONEYDJ_CACHE_INCREMENTAL_UPDATE_ENABLED: "1"

      # MoneyDJ 完整性保護：
      # API4 成功率低於 98%，或 API5 有連線／解析失敗時，
      # 本次停止同步 Google Sheet，避免產生不完整報表。
      MONEYDJ_MIN_PRESCAN_SUCCESS_RATIO: "0.97"
      MONEYDJ_API5_STRICT: "1"

      # ============================================================
      # 權證／標的身分防錯
      # ============================================================
      WARRANT_IDENTITY_RECONCILE_ENABLED: "1"
      WARRANT_IDENTITY_OVERRIDE_MIN_PREFIX: "3"
      WARRANT_IDENTITY_REPAIR_HISTORY: "1"
      # 歷史保護模式不修改 Google Sheet 既有列；身分修正只反映在新插入資料。
      GSHEET_REPAIR_SECURITY_IDENTITY_ROWS: "0"

      # ============================================================
      # 基本快取
      # ============================================================
      USE_CACHE: "1"
      FORCE_FULL_CACHE_REFRESH: "0"
      CACHE_AUTO_PRUNE_ENABLED: "1"
      HISTORY_RETENTION_TRADING_DAYS: "200"
      PRICE_RETENTION_TRADING_DAYS: "260"

      # ============================================================
      # 精選五分點
      # ============================================================
      SELECTED_TARGET_LABELS: "華南永昌台中,元大南屯,富邦敦南,永豐金內湖,新光"

      # ============================================================
      # 價格與報表規則
      # ============================================================
      FETCH_GROUP_WARRANT_PRICES: "0"
      PRICE_WORKERS: "60"

      TOP15_CACHE_ENABLED: "1"
      TOP15_LOOKBACK_TRADING_DAYS: "40"
      # repair 回補近一個月的 TOP15 每日快照（約 22 個交易日）。
      TOP15_REPAIR_BACKFILL_TRADING_DAYS: "22"
      TOP15_PRICE_LOOKBACK_DAYS: "75"
      TOP15_TARGET_PRICE_REFETCH_DAYS: "12"
      TOP15_REQUIRE_TARGET_DATE_PRICE: "1"
      TOP15_EXCLUDE_MISSING_PRICE_FROM_RETURN: "1"
      TOP15_MIN_BROKER_REMAINING_COST: "100000"

      TOP15_LP_QUOTE_FALLBACK_ENABLED: "0"
      TOP15_LP_QUOTE_TIMEOUT_SECONDS: "15"
      TOP15_LP_QUOTE_WORKERS: "10"
      TOP15_LP_ALLOW_IMPLICIT_LATEST_DATE: "0"
      TOP15_LAST_TRADE_FALLBACK_ENABLED: "1"
      TOP15_LAST_TRADE_FALLBACK_MAX_DAYS: "75"
      TOP15_TRADED_PRICE_COVERAGE_NOTE_THRESHOLD_PCT: "60"

      SELL_DETAIL_DAYS: "3"

      # ============================================================
      # 完整修補延伸報表
      # 每日流程只同步八張主要工作表；完整修補模式才建立延伸報表。
      # ============================================================
      RECENT_RANKING_DAYS: "62"
      WARRANT_CONSENSUS_7D_ENABLED: "1"
      WARRANT_CONSENSUS_7D_DAYS: "7"
      WARRANT_CONSENSUS_14D_DAYS: "14"
      WARRANT_CONSENSUS_21D_DAYS: "21"
      WARRANT_CONSENSUS_7D_TOP_N: "15"
      BROKER_10D_DETAIL_ENABLED: "1"
      BROKER_10D_WINRATE_RANK_ENABLED: "1"
      BROKER_10D_DETAIL_DAYS: "10"

      # ============================================================
      # 長期留單
      # ============================================================
      LONGTERM_OPEN_DAYS: "120,150,180"
      LONGTERM_PRICE_LOOKBACK_DAYS: "420"
      LONGTERM_PRICE_STALE_DAYS: "10"
      LONGTERM_ZERO_PRICE_THRESHOLD: "0.05"
      LONGTERM_UPDATE_WINRATE_SHEET: "1"
      LONGTERM_UPLOAD_FULL_WORKBOOK_TO_GSHEET: "0"

      # ============================================================
      # Google Sheet 歷史保護：
      # daily 與 repair 都只新增缺少的唯一資料，不清空、不刪列、不裁切歷史。
      # repair + RUN_MODE=2 會補齊完整歷史及近 22 個交易日 TOP15 快照。
      # ============================================================
      GOOGLE_SHEET_NAME: "權證分點資料_NEW_MoneyDJ"
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID_MONEYDJ }}
      GSHEET_REPAIR_REQUIRE_EXPLICIT_ID: "1"
      GSHEET_MAIN_ALLOW_CREATE: "0"

      GSHEET_CACHE_ENABLED: "0"
      GSHEET_RESULT_ENABLED: "1"
      GSHEET_RESULT_UPSERT_ENABLED: "1"
      GSHEET_PRESERVE_ALL_HISTORY: "1"
      GSHEET_CLEAN_DELETED_BROKER_ROWS: "0"
      GSHEET_RESULT_ARCHIVE_ENABLED: "0"
      GSHEET_COMPACT_BLANK_GRID_ENABLED: "0"

      # 歷史保護模式禁止 repair 先 clear；保留變數供舊版相容，但明確關閉。
      GSHEET_REPAIR_STATIC_VALUE_INPUT_OPTION: "USER_ENTERED"
      GSHEET_REPAIR_CLEAR_BEFORE_WRITE: "0"
      GSHEET_VERIFY_SETTLE_SECONDS: "0.30"

      GSHEET_WRITE_SLEEP_SECONDS: "0.05"
      GSHEET_WRITE_RATE_PER_MINUTE: "45"
      GSHEET_WRITE_BURST: "5"
      GSHEET_MAX_RETRIES: "6"
      GSHEET_RETRY_BASE_SECONDS: "12"

      GCP_SERVICE_KEY: ${{ secrets.GCP_SERVICE_KEY_NEW }}

      # ============================================================
      # Supabase
      # 要啟用時改成 1，並在 GitHub Secrets 設定 SUPABASE_DB_URL。
      # ============================================================
      SUPABASE_CACHE_ENABLED: "0"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SCHEMA: "warrant_cache"
      SUPABASE_BATCH_SIZE: "5000"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore MoneyDJ local cache
        id: moneydj-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: warrant_cache
          key: warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-
            warrant-cache-moneydj-v10-${{ runner.os }}-
            warrant-cache-moneydj-v7-${{ runner.os }}-

      - name: Resolve run settings
        shell: bash
        run: |
          PLAN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_plan || '每日自動流程' }}"

          WORKFLOW_MODE="daily"
          RUN_MODE="2"
          INITIAL_HISTORY_DAYS="200"
          DAILY_UPDATE_DAYS="3"

          case "$PLAN" in
            "每日自動流程")
              ;;

            "精選五分點新分類")
              RUN_MODE="1"
              ;;

            "長期留單補價格")
              WORKFLOW_MODE="longterm"
              RUN_MODE="2"
              ;;

            "完整修補模式")
              WORKFLOW_MODE="repair"
              RUN_MODE="2"
              # FinMind 補足最近 200 個成功交易日完整歷史，MoneyDJ 補強最新資料；
              # Google Sheet 僅增量補齊，並回補近 22 個交易日 TOP15 快照。
              INITIAL_HISTORY_DAYS="200"
              DAILY_UPDATE_DAYS="5"
              ;;

            *)
              echo "不支援的執行方案：$PLAN"
              exit 1
              ;;
          esac

          {
            echo "WORKFLOW_MODE=$WORKFLOW_MODE"
            echo "RUN_MODE=$RUN_MODE"
            echo "INITIAL_HISTORY_DAYS=$INITIAL_HISTORY_DAYS"
            echo "DAILY_UPDATE_DAYS=$DAILY_UPDATE_DAYS"
          } >> "$GITHUB_ENV"

          echo "=========================================="
          echo "執行方案：$PLAN"
          echo "WORKFLOW_MODE：$WORKFLOW_MODE"
          echo "RUN_MODE：$RUN_MODE"
          echo "INITIAL_HISTORY_DAYS：$INITIAL_HISTORY_DAYS"
          echo "DAILY_UPDATE_DAYS：$DAILY_UPDATE_DAYS"
          echo "資料來源：FinMind 全市場完整歷史＋MoneyDJ 最新資料補強"
          echo "=========================================="

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

          pip install \
            requests \
            pandas \
            openpyxl \
            pyarrow \
            lxml \
            html5lib \
            beautifulsoup4 \
            gspread \
            google-auth \
            "psycopg[binary]"

      - name: Run Hybrid FinMind and MoneyDJ warrant backtest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output warrant_cache

          SCRIPT_PATH="$PYTHON_FILE"
          EXPECTED_BUILD_ID="HYBRID-FINMIND-GSHEET-APPEND-ONLY-TOP15-1M-BACKFILL-20260730-R7"

          # 只允許執行目前正式 Hybrid 檔案，不再退回任何舊 MoneyDJ 檔名。
          if [[ ! -f "$SCRIPT_PATH" ]]; then
            echo "找不到正式 Hybrid 程式碼：$SCRIPT_PATH"
            echo "目前倉庫內的 Python 檔案："
            find . -maxdepth 2 -type f -name "*.py" -print
            exit 1
          fi

          # 防止 GitHub 倉庫仍是舊版程式，卻誤以為已經執行歷史保護版 R7。
          if ! grep -Fq "$EXPECTED_BUILD_ID" "$SCRIPT_PATH"; then
            echo "程式版本驗證失敗：$SCRIPT_PATH 不是指定的歷史保護版 Hybrid R7。"
            echo "預期 Build ID：$EXPECTED_BUILD_ID"
            grep -n "PROGRAM_BUILD_ID" "$SCRIPT_PATH" || true
            exit 1
          fi

          # 完整修補一定要鎖定明確的試算表 ID，禁止依名稱誤寫到別份檔案。
          if [[ "${WORKFLOW_MODE:-daily}" == "repair" && -z "${GOOGLE_SHEET_ID:-}" ]]; then
            echo "完整修補模式缺少 GOOGLE_SHEET_ID。"
            echo "請建立 GitHub Secret：GOOGLE_SHEET_ID_MONEYDJ。"
            exit 1
          fi

          echo "執行程式：$SCRIPT_PATH"
          echo "驗證版本：$EXPECTED_BUILD_ID"
          python "$SCRIPT_PATH"

      - name: Save MoneyDJ local cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: warrant_cache
          key: warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Prune old MoneyDJ caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-
        shell: bash
        run: |
          echo "保留同分支最新3份MoneyDJ cache，刪除更舊項目。"
          mapfile -t OLD_CACHE_IDS < <(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --key "$CACHE_PREFIX" \
              --ref "$GITHUB_REF" \
              --sort created_at \
              --order desc \
              --limit 100 \
              --json id \
              --jq '.[3:][] | .id'
          )

          if [ "${#OLD_CACHE_IDS[@]}" -eq 0 ]; then
            echo "沒有需要刪除的舊MoneyDJ cache。"
            exit 0
          fi

          for cache_id in "${OLD_CACHE_IDS[@]}"; do
            echo "刪除舊MoneyDJ cache id=$cache_id"
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warrant-backtest-moneydj-new-excel
          path: output/*.xlsx
          if-no-files-found: ignore
          retention-days: 14
