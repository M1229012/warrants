name: Warrant Backtest Google Sheet - MoneyDJ

on:
  workflow_dispatch:
    inputs:
      run_plan:
        description: "執行方案"
        required: true
        default: "每日自動流程"
        type: choice
        options:
          - "每日自動流程"
          - "精選五分點新分類"
          - "長期留單補價格"
          - "完整修補模式"

      target_date:
        description: "補跑指定交易日 YYYY/MM/DD（留空＝自動抓最新已發布日）"
        required: false
        default: ""
        type: string

  # 測試期間停用排程，只保留 workflow_dispatch。


permissions:
  contents: read
  actions: write


jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # ============================================================
      # 路徑與程式
      # ============================================================
      OUTPUT_DIR: output
      CACHE_DIR: warrant_cache
      PYTHON_FILE: warrant_backtest_moneydj.py

      # ============================================================
      # MoneyDJ 抓取策略（AUDIT8 重點）
      # ------------------------------------------------------------
      # 舊流程 daily 要先掃全市場 41,200 檔 API4，才去拿真正要的今日籌碼。
      # 實測掃 28,000 檔只找到 1,772 組候選 —— 93% 的請求都在確認
      # 「這檔沒有我追蹤的分點」，而那個答案天天一樣。
      # 被限流時更慘：貴的部分先花光，要的資料一筆都拿不到。
      #
      # 今日優先兩階段：
      #   第一階段 直接用歷史快取的活躍組合（約 2,700 組）→ API6 精準查今日
      #   第二階段 才去探索新組合，有預算上限、被擋就收手
      # 請求數 44,000 → 約 2,700（DISCOVERY_BUDGET=0 時）
      # ============================================================
      MONEYDJ_DAILY_TODAY_FIRST: "1"

      # 第一次先設 0：只查已知組合，幾分鐘跑完。
      # 確認資料正確且穩定後，再改成 8000 打開新組合探索。
      MONEYDJ_DISCOVERY_BUDGET: "8000"

      MONEYDJ_DAILY_ACTIVE_PAIR_DAYS: "20"
      MONEYDJ_DISCOVERY_ROTATION_SLICES: "5"
      MONEYDJ_DISCOVERY_ABORT_AFTER_FAILURES: "60"

      # daily 目標日改用 API6「by 區間」精準查詢（d=e=目標日），
      # 一次命中，不必再用 5→50→200 筆逐步擴大回查。
      MONEYDJ_DAILY_USE_API6: "1"
      MONEYDJ_DYNAMIC_HASH_ENABLED: "1"

      # ============================================================
      # MoneyDJ 併發與限流
      # ------------------------------------------------------------
      # 實證資料（不要再往上調）：
      #   15 req/s → 23,892 筆全數跑完，0 次限流
      #   25 req/s → 約 4,000 筆就被擋，之後全程卡在冷卻
      # 門檻落在 15~25 之間。15 是已知安全值，MAX 也鎖在 15，
      # 不讓自動回升把速率推回危險區。
      # ============================================================
      MONEYDJ_PRESCAN_WORKERS: "20"
      MONEYDJ_HISTORY_WORKERS: "20"
      MONEYDJ_RECENT_SCAN_DAYS: "50"
      MONEYDJ_API5_HISTORY_LIMIT: "200"
      MONEYDJ_MAX_RETRIES: "3"
      MONEYDJ_RETRY_BASE_SECONDS: "1.0"

      # 全域速率限制：被擋就自動減半，連續成功再緩慢回升。
      MONEYDJ_RATE_LIMIT_ENABLED: "1"
      MONEYDJ_RATE_START_PER_SECOND: "15"
      MONEYDJ_RATE_MIN_PER_SECOND: "5"
      MONEYDJ_RATE_MAX_PER_SECOND: "15"

      # 限流偵測：
      #   HTTP 200 但 Content-Type 不是 json → 限流頁（57B 請稍候／22KB HTML）
      #   慢速 500、逾時、429                → 限流
      #   快速 500（固定那批壞代號）          → 不是限流，不冷卻
      MONEYDJ_THROTTLE_DETECT_ENABLED: "1"
      MONEYDJ_THROTTLE_ESCALATE_MIN_GAP: "10"
      MONEYDJ_THROTTLE_BASE_COOLDOWN: "15"
      MONEYDJ_THROTTLE_MAX_COOLDOWN: "45"
      MONEYDJ_HOLD_ON_EXTRA_ATTEMPTS: "6"
      MONEYDJ_FAILURE_SAMPLE_PRINTS: "3"

      # API5 前置探測：跑大量請求前先確認對方活著，掛了 30 秒內收手。
      MONEYDJ_API5_PREFLIGHT_ENABLED: "1"
      MONEYDJ_API5_PREFLIGHT_SAMPLE: "8"
      MONEYDJ_API5_PREFLIGHT_RETRY_ROUNDS: "2"
      MONEYDJ_API5_PREFLIGHT_RETRY_WAIT: "90"

      # 降級模式：今日抓不到時，退回快取最後一個完整交易日產出報表，
      # 而不是整輪作廢。統計日期欄位誠實寫退回後的日期，不冒充今日。
      MONEYDJ_DEGRADED_FALLBACK_ENABLED: "1"
      MONEYDJ_DEGRADED_MAX_LOOKBACK_DAYS: "10"

      # 完整性保護：API4 成功率不足或 API5 有失敗時不寫 Google Sheet。
      MONEYDJ_MIN_PRESCAN_SUCCESS_RATIO: "0.97"
      MONEYDJ_API5_STRICT: "1"

      # ============================================================
      # 權證／標的身分防錯
      # ============================================================
      WARRANT_IDENTITY_RECONCILE_ENABLED: "1"
      WARRANT_IDENTITY_OVERRIDE_MIN_PREFIX: "3"
      WARRANT_IDENTITY_REPAIR_HISTORY: "1"
      GSHEET_REPAIR_SECURITY_IDENTITY_ROWS: "0"

      # ============================================================
      # 基本快取
      # ============================================================
      USE_CACHE: "1"
      FORCE_FULL_CACHE_REFRESH: "0"
      CACHE_AUTO_PRUNE_ENABLED: "1"
      CACHE_WRITE_CSV_COMPAT: "0"
      HISTORY_RETENTION_TRADING_DAYS: "200"
      PRICE_RETENTION_TRADING_DAYS: "260"

      # ============================================================
      # 精選五分點
      # ============================================================
      SELECTED_TARGET_LABELS: "華南永昌台中,元大南屯,富邦敦南,永豐金內湖,新光"

      # ============================================================
      # 價格與報表規則
      # ============================================================
      FETCH_GROUP_WARRANT_PRICES: "0"
      PRICE_WORKERS: "60"
      DAILY_PRICE_LOAD_ALL_EVENT_CODES: "1"

      TOP15_CACHE_ENABLED: "1"
      TOP15_LOOKBACK_TRADING_DAYS: "40"
      TOP15_REPAIR_BACKFILL_TRADING_DAYS: "22"
      TOP15_PRICE_LOOKBACK_DAYS: "75"
      TOP15_TARGET_PRICE_REFETCH_DAYS: "12"
      TOP15_REQUIRE_TARGET_DATE_PRICE: "1"
      TOP15_EXCLUDE_MISSING_PRICE_FROM_RETURN: "1"
      TOP15_MIN_BROKER_REMAINING_COST: "100000"

      TOP15_LP_QUOTE_FALLBACK_ENABLED: "0"
      TOP15_LP_QUOTE_TIMEOUT_SECONDS: "15"
      TOP15_LP_QUOTE_WORKERS: "10"
      TOP15_LP_ALLOW_IMPLICIT_LATEST_DATE: "0"
      TOP15_LAST_TRADE_FALLBACK_ENABLED: "1"
      TOP15_LAST_TRADE_FALLBACK_MAX_DAYS: "75"
      TOP15_TRADED_PRICE_COVERAGE_NOTE_THRESHOLD_PCT: "60"

      SELL_DETAIL_DAYS: "3"

      # ============================================================
      # 完整修補延伸報表（只有 repair 會建立）
      # ============================================================
      RECENT_RANKING_DAYS: "62"
      WARRANT_CONSENSUS_7D_ENABLED: "1"
      WARRANT_CONSENSUS_7D_DAYS: "7"
      WARRANT_CONSENSUS_14D_DAYS: "14"
      WARRANT_CONSENSUS_21D_DAYS: "21"
      WARRANT_CONSENSUS_7D_TOP_N: "15"
      BROKER_10D_DETAIL_ENABLED: "1"
      BROKER_10D_WINRATE_RANK_ENABLED: "1"
      BROKER_10D_DETAIL_DAYS: "10"

      # ============================================================
      # 長期留單
      # ============================================================
      LONGTERM_OPEN_DAYS: "120,150,180"
      LONGTERM_PRICE_LOOKBACK_DAYS: "420"
      LONGTERM_PRICE_STALE_DAYS: "10"
      LONGTERM_ZERO_PRICE_THRESHOLD: "0.05"
      LONGTERM_UPDATE_WINRATE_SHEET: "1"
      LONGTERM_UPLOAD_FULL_WORKBOOK_TO_GSHEET: "0"

      # repair 勝率：持有滿 60 日未出清者按統計日估值；已下市／到期且無價以 0 結算。
      # 【repair 改用現有快取重算，不再全量重抓 MoneyDJ】
      # 全量重建要掃 83,429 支權證（其中 42,203 支已到期）＋ 8.8 萬組以上 API5，
      # 15 req/s 下光網路就要 3 小時以上，還會卡在 API4 成功率 97% 的閘門。
      # 設 0 之後 repair 走 daily 已驗證的抓取路徑（今日優先，約 2.4 萬次），
      # 其餘 21 張表由 daily 每天維護的 200 交易日歷史快取直接重算。
      REPAIR_FULL_HISTORY_FROM_MONEYDJ_ENABLED: "0"

      # repair 預設連「全分點」也算型態，但 K 線請求沒有經過速率限制器。
      # 近一個月 TOP15 圖只讀精選五分點，全分點型態沒有任何圖在用。
      # 設 0 讓 repair 的型態範圍跟 daily 一樣（已驗證約 40 檔，每檔只抓一次）。
      PATTERN_ALL_SCOPES_IN_REPAIR: "1"

      WINRATE_MARK_TO_MARKET_DAYS: "60"
      WINRATE_MARK_TO_MARKET_REPAIR_ENABLED: "1"
      WINRATE_MARK_TO_MARKET_FAIL_ON_UNRESOLVED: "1"
      WINRATE_DELISTED_MISSING_PRICE: "0"

      # ============================================================
      # Google Sheet 同步
      # daily 保留其他日期歷史；repair + RUN_MODE=2 將 21 張結果表完整重建。
      # ============================================================
      GOOGLE_SHEET_NAME: "權證分點資料_NEW_MoneyDJ"
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID_MONEYDJ }}
      GSHEET_REPAIR_REQUIRE_EXPLICIT_ID: "1"
      GSHEET_MAIN_ALLOW_CREATE: "0"

      GSHEET_CACHE_ENABLED: "0"
      GSHEET_RESULT_ENABLED: "1"
      GSHEET_RESULT_UPSERT_ENABLED: "1"
      GSHEET_PRESERVE_ALL_HISTORY: "1"

      # 【型態空白的真正原因】
      # TOP15 是「某統計日的快照」，同日重跑就該以本次結果為準。
      # 但 GSHEET_PRESERVE_ALL_HISTORY=1 的安全門是「只新增缺少的列、
      # 既有列一律不動」，而 TOP15 的整批替換路徑被這道門擋掉了 ——
      # 於是第一次跑出來的空型態、舊報酬率永遠卡在表上，之後每天算好的
      # 型態全被丟棄（log 會顯示「無缺少資料，既有資料完全保留」）。
      GSHEET_TOP15_SNAPSHOT_REPLACE: "1"

      # 補跑指定交易日：留空＝照常抓最新。
      # 用途：某一天的 TOP15 因為當時抓不到 K 線而寫成「-／Missing」，
      #       填入那一天重跑，替換路徑就會用正確的型態蓋掉那批壞列。
      MONEYDJ_DAILY_TARGET_DATE: ${{ github.event.inputs.target_date }}

      # 這個只影響 A～E／每日賣出明細，替換範圍動輒 30 天以上。
      # 開了才會把「今日賣出導致的舊事件出清狀態」真的寫回既有列；
      # 代價是那段期間的既有列會以本次結果重寫。確認資料無誤再開。
      GSHEET_DAILY_SNAPSHOT_REPLACE: "0"
      GSHEET_REPAIR_FULL_RESULT_OVERWRITE_ENABLED: "1"
      GSHEET_REPAIR_WINRATE_OVERWRITE_ENABLED: "1"
      GSHEET_CLEAN_DELETED_BROKER_ROWS: "0"
      GSHEET_RESULT_ARCHIVE_ENABLED: "0"
      GSHEET_COMPACT_BLANK_GRID_ENABLED: "0"

      GSHEET_WRITE_SLEEP_SECONDS: "0.05"
      GSHEET_WRITE_RATE_PER_MINUTE: "45"
      GSHEET_WRITE_BURST: "5"
      GSHEET_MAX_RETRIES: "6"
      GSHEET_RETRY_BASE_SECONDS: "12"

      GCP_SERVICE_KEY: ${{ secrets.GCP_SERVICE_KEY_NEW }}

      # ============================================================
      # Supabase（要啟用時改成 1，並設定 SUPABASE_DB_URL）
      # ============================================================
      SUPABASE_CACHE_ENABLED: "0"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SCHEMA: "warrant_cache"
      SUPABASE_BATCH_SIZE: "5000"


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore MoneyDJ local cache
        id: moneydj-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: warrant_cache
          key: warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-
            warrant-cache-moneydj-v10-${{ runner.os }}-
            warrant-cache-moneydj-v7-${{ runner.os }}-

      - name: Resolve run settings
        shell: bash
        run: |
          PLAN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_plan || '每日自動流程' }}"

          WORKFLOW_MODE="daily"
          RUN_MODE="2"

          case "$PLAN" in
            "每日自動流程")
              ;;

            "精選五分點新分類")
              RUN_MODE="1"
              ;;

            "長期留單補價格")
              WORKFLOW_MODE="longterm"
              RUN_MODE="2"
              ;;

            "完整修補模式")
              WORKFLOW_MODE="repair"
              RUN_MODE="2"
              ;;

            *)
              echo "不支援的執行方案：$PLAN"
              exit 1
              ;;
          esac

          {
            echo "WORKFLOW_MODE=$WORKFLOW_MODE"
            echo "RUN_MODE=$RUN_MODE"
          } >> "$GITHUB_ENV"

          echo "=========================================="
          echo "執行方案：$PLAN"
          echo "WORKFLOW_MODE：$WORKFLOW_MODE"
          echo "RUN_MODE：$RUN_MODE"
          if [[ "$WORKFLOW_MODE" == "daily" ]]; then
            echo "抓取策略：今日優先兩階段（MONEYDJ_DAILY_TODAY_FIRST=${MONEYDJ_DAILY_TODAY_FIRST}）"
            echo "探索預算：${MONEYDJ_DISCOVERY_BUDGET}（0＝只查已知組合）"
          else
            echo "抓取策略：完整掃描（repair／longterm 不受今日優先影響）"
          fi
          echo "資料來源：TWSE／TPEx 官方權證母體＋MoneyDJ API4／API5／API6"
          echo "=========================================="

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi

          pip install \
            requests \
            pandas \
            openpyxl \
            pyarrow \
            lxml \
            html5lib \
            beautifulsoup4 \
            gspread \
            google-auth \
            "psycopg[binary]"

      - name: Run MoneyDJ warrant backtest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output warrant_cache

          SCRIPT_PATH="$PYTHON_FILE"
          EXPECTED_BUILD_ID="OFFICIAL-TWSE-TPEX-GSHEET-MTM60-DELISTED-REPAIR-SHAPEDETECT-20260903-R18-AUDIT8"

          if [[ ! -f "$SCRIPT_PATH" ]]; then
            echo "找不到程式碼：$SCRIPT_PATH"
            echo "目前倉庫內的 Python 檔案："
            find . -maxdepth 2 -type f -name "*.py" -print
            exit 1
          fi

          # 版本閘門：倉庫裡的程式必須就是這個 Build ID。
          # 注意：程式內若保留「相容舊版本驗證字串」的註解，這道閘門會被繞過。
          if ! grep -Fq "$EXPECTED_BUILD_ID" "$SCRIPT_PATH"; then
            echo "程式版本驗證失敗：$SCRIPT_PATH 不是預期的版本。"
            echo "預期 Build ID：$EXPECTED_BUILD_ID"
            grep -n "PROGRAM_BUILD_ID" "$SCRIPT_PATH" || true
            exit 1
          fi

          # 完整修補一定要鎖定明確的試算表 ID，禁止依名稱誤寫到別份檔案。
          if [[ "${WORKFLOW_MODE:-daily}" == "repair" && -z "${GOOGLE_SHEET_ID:-}" ]]; then
            echo "完整修補模式缺少 GOOGLE_SHEET_ID。"
            echo "請建立 GitHub Secret：GOOGLE_SHEET_ID_MONEYDJ。"
            exit 1
          fi

          echo "執行程式：$SCRIPT_PATH"
          echo "驗證版本：$EXPECTED_BUILD_ID"
          python "$SCRIPT_PATH"

      - name: Save MoneyDJ local cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: warrant_cache
          key: warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Prune old MoneyDJ caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: warrant-cache-moneydj-v10-${{ runner.os }}-${{ github.ref_name }}-
        shell: bash
        run: |
          echo "保留同分支最新3份MoneyDJ cache，刪除更舊項目。"
          mapfile -t OLD_CACHE_IDS < <(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --key "$CACHE_PREFIX" \
              --ref "$GITHUB_REF" \
              --sort created_at \
              --order desc \
              --limit 100 \
              --json id \
              --jq '.[3:][] | .id'
          )

          if [ "${#OLD_CACHE_IDS[@]}" -eq 0 ]; then
            echo "沒有需要刪除的舊MoneyDJ cache。"
            exit 0
          fi

          for cache_id in "${OLD_CACHE_IDS[@]}"; do
            echo "刪除舊MoneyDJ cache id=$cache_id"
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload Excel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warrant-backtest-moneydj-new-excel
          path: output/*.xlsx
          if-no-files-found: ignore
          retention-days: 14

      # MoneyDJ 診斷檔（失敗明細 JSONL、預篩失敗代號）留在 runner 的
      # output/warrant_cache 下，原本會隨 job 結束消失。出事時這些最有用。
      - name: Upload MoneyDJ diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: warrant-backtest-moneydj-diagnostics
          path: |
            warrant_cache/moneydj_request_failures_*.jsonl
            warrant_cache/prescan_failed_codes.csv
          if-no-files-found: ignore
          retention-days: 14
